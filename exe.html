    function load_states(){
        let opt = `<option value=""> -- Select States -- </option>`
        states.forEach((s,i) => {
            opt+=`<option value="${i}">${s.name}</option>`
        });
        document.querySelector('#states').innerHTML = opt
    }
    
    function load_lga(index){
       let  opt = `<option value=""> -- Select LGA -- </option>`
        let lgas = states[index].lga
        lgas.forEach(l=>{
            opt+=`<option value="${l}">${l} </option>`
        })
        document.querySelector('#lga').innerHTML = opt
    }
    
    load_states()

    
    text = '<option value=""> -- YEARS -- </option>'
    let now  = new Date().getFullYear()
    start = now - 35
    end = now - 18
    for(i = start; i<=end; i++){
        text+=`<option>${i}</option>`
    }
    document.querySelector('#years').innerHTML = text


    units = [
        {label:'MINS - SEC', id:'min_sec', solve:function(value){
            return {
                value: eval(value * 60),
                'text': " Mins to Seconds" 
            }
        }},
        {label:'SEC - MINS', id:'min_sec', solve:function(value){
            return {
                value: eval(value / 60),
                'text': "  Seconds to Mins" 
            }
        }},
        {label:'Week to Days', id:'wk_days', solve:function(value){
            return {
                value: eval(value * 7),
                'text': "  Seconds to Mins" 
            }
        }},
    ]

    type_elt = document.querySelector('#type');
    units.forEach((u,index) =>{
        type_elt.innerHTML +=`<option value='${index}'> ${u.label} </option>` 
    })
    
    function converter(index){
        input = document.querySelector('#value').value
        conversion = units[index]
        let solve  = conversion.solve(input)
        // document.querySelector('#text').innerHTML = eval(`${input} ${conversion.op} ${60}`)
        document.querySelector('#text').innerHTML = solve.text +" = "+ solve.value

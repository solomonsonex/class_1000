<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
         */
        *{
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        body{
            background-color: aliceblue;
        }
        form{
            width: 90%;
            max-width:450px;
            margin:40px auto;
            background: #fff;
            padding: 12px;
            border-radius: 5px;
        }
        input, button{
            width: 100%;
            padding: 20px;
            margin: 10px auto;
            border:2px solid aliceblue;
            border-radius:5px;
        }
        input[type='checkbox']{
            width: auto;
        }
        a{
            text-decoration:none
        }
        button{
            background: orange;
            font-weight: 700;
            color:#fff
        }
    </style>
</head>
<body>
    <form action="">
        <div>
            <input data-name="First Name" id="first_name" type="text" placeholder="Email or Mobile Number" required>
            <input data-name ='Last Name' id="last_name" type="text" placeholder="Email or Mobile Number" required>
        </div>
        <div>
            <input data-name="Username"  id="Username" type="text" placeholder="Email or Mobile Number" required>
        </div>
        <div>
            <input data-name="password" id="password" type="password" placeholder="Password" required>
        </div>
        
        <div>
            <input type="checkbox">
            <label for=""> Remember Me</label>
        </div>

        <div>
            <a href=""> Forgot password</a>
        </div>
        <div>
            <button> Submit </button>
        </div>
        
        <p>  <a href="register.html"> Create account </a></p>
    </form>
</body>
</html>

<script>
    person = {}
    document.querySelectorAll('input')
    .forEach(i=>{
        if(i.value == ''){
            // elt = i.id.replace('_', " ")
            // i.placeholder = elt[0].toUpperCase() + 
            // elt.slice(1)+ ' is required'
            i.placeholder =   i.dataset.name  
            +' is required'
            i.style.border='1px solid red'
            person[i.id] = i.value
        }
    })
  console.log(person)
</script>
